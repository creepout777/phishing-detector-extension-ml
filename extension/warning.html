<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warning: possible phishing site</title>
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(20, 10, 15, 0.6);
      --red: #ff1744;
      --red-glow: rgba(255, 23, 68, 0.2);
      --text: #ffffff;
      --text-muted: #a0a5c0;
      --border: rgba(255, 23, 68, 0.15);
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {

      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      overflow: hidden;
      background: radial-gradient(circle at center, rgba(255, 23, 68, 0.08) 0%, transparent 70%), var(--bg);
    }

    .container {
      max-width: 600px;
      width: 100%;
      text-align: center;
      animation: zoom-in 0.4s cubic-bezier(0.1, 0.8, 0.3, 1);
    }

    .shield-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #ff5252 0%, #ff1744 100%);
      border-radius: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 40px;
      box-shadow: 0 10px 30px var(--red-glow);
      animation: pulse-glow 2s infinite;
    }

    h1 {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }

    .warning-desc {
      font-size: 16px;
      color: var(--text-muted);
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .details-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      text-align: left;
      margin-bottom: 30px;
      backdrop-filter: blur(10px);
    }

    .details-title {
      font-size: 13px;
      font-weight: 800;
      color: var(--red);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      display: block;
    }

    .url-display {
      font-family: monospace;
      font-size: 14px;
      background-color: rgba(255, 255, 255, 0.03);
      padding: 8px 12px;
      border-radius: 8px;
      word-break: break-all;
      color: #ff8a80;
      border: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 14px;
    }

    ul.threats {
      list-style-type: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    ul.threats li {
      font-size: 13px;
      color: var(--text-muted);
      padding-left: 18px;
      position: relative;
    }

    ul.threats li::before {
      content: "•";
      color: var(--red);
      font-weight: bold;
      position: absolute;
      left: 0;
      top: -1px;
      font-size: 16px;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .btn {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 14px;
      padding: 12px 28px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background-color: #ffffff;
      color: #000000;
    }

    .btn-primary:hover {
      background-color: #e0e0e0;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.03);
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.2);
    }

    @keyframes pulse-glow {
      0% {
        transform: scale(1);
        box-shadow: 0 0 0 0 var(--red-glow);
      }
      70% {
        transform: scale(1.03);
        box-shadow: 0 0 0 15px rgba(255, 23, 68, 0);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(255, 23, 68, 0);
      }
    }

    @keyframes zoom-in {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="shield-icon">⚠️</div>
    <h1>Deceptive Site Ahead</h1>
    <p class="warning-desc">Phishing Shield stopped this page from loading. Its address and content look like a site built to steal passwords or payment details.</p>
    
    <div class="details-box">
      <span class="details-title">Why it was blocked</span>
      <div class="url-display" id="blocked-url">https://example.com/login</div>
      <ul class="threats" id="threats-list">
        <li>Loading the reasons for this warning...</li>
      </ul>
    </div>

    <div class="actions">
      <button class="btn btn-primary" id="back-btn">Go Back to Safety</button>
      <button class="btn btn-secondary" id="bypass-btn">I trust this site, continue</button>
    </div>
  </div>
  <script src="warning.js"></script>
</body>
</html>
